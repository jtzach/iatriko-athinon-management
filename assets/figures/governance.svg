<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Ευθύνη και εποπτεία</title>
<desc id="figure-description">Πώς διακρίνονται οι γραμμές αναφοράς της Μονάδας Διαχείρισης Κινδύνων; Ετήσια έκθεση 2025 · PDF σ. 27–28 · ίδια έντυπη αρίθμηση. Η διάκριση αφορά τη συγκεκριμένη Μονάδα Διαχείρισης Κινδύνων. Πρόκειται για εταιρική περιγραφή των επίσημων γραμμών αναφοράς. CEO/Γενικός Διευθυντής και ΔΣ/Επιτροπή Ελέγχου διατηρούνται ως δύο σύνθετες διατυπώσεις της πηγής. Το μικρό διάγραμμα δεν ανακατασκευάζει ολόκληρο το οργανόγραμμα ή την πλήρη κατανομή αρμοδιοτήτων.</desc>
