<text x="800" y="480" font-family="Arial" font-size="20" fill="#276f5d" font-weight="400" text-anchor="middle" >θεματική σύνδεση</text>
<text x="800" y="539" font-family="Arial" font-size="18" fill="#4e626a" font-weight="400" text-anchor="middle" >προς διερεύνηση</text>
<rect x="70" y="640" width="1460" height="160" rx="18" fill="#e5f1eb" stroke="none" stroke-width="2"/>
<text x="100" y="681" font-family="Arial" font-size="28" fill="#276f5d" font-weight="650" text-anchor="start" >Τι θα μπορούσε να μετρήσει η διοίκηση;</text>
<text x="100" y="732" font-family="Arial" font-size="24" fill="#22343d" font-weight="600" text-anchor="start" >Χρόνο παραγωγής αναφορών</text>
<text x="590" y="732" font-family="Arial" font-size="24" fill="#22343d" font-weight="600" text-anchor="start" >Έγκαιρο εντοπισμό αποκλίσεων</text>
<text x="1120" y="732" font-family="Arial" font-size="24" fill="#22343d" font-weight="600" text-anchor="start" >Σφάλματα πληροφόρησης</text>
<text x="100" y="772" font-family="Arial" font-size="22" fill="#4e626a" font-weight="400" text-anchor="start" >Προτεινόμενα κριτήρια αξιολόγησης — δεν αποτελούν ήδη μετρημένα αποτελέσματα.</text>
<text x="70" y="842" font-family="Arial" font-size="22" fill="#22343d" font-weight="550" text-anchor="start" >Η θεματική σύνδεση δεν αποδεικνύει επίδραση του SAP στους συγκεκριμένους ελέγχους.</text>
<text x="70" y="877" font-family="Arial" font-size="22" fill="#4e626a" font-weight="400" text-anchor="start" >Η αναφορά σε ERP δεν τεκμηριώνει εταιρική χρήση μεγάλων γλωσσικών μοντέλων (LLMs).</text>
