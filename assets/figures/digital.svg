<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Τεχνολογία και αποφάσεις</title>
<desc id="figure-description">Τι συνδέει την εφαρμογή SAP με την παρακολούθηση αποτελεσμάτων και τι χρειάζεται ακόμη να μετρηθεί; Εξαμηνιαία έκθεση 2026 · PDF σ. 16, έντυπη σ. 15. Ετήσια έκθεση 2025 · PDF σ. 10, 93–94, έντυπες σ. 10, 94–95. Η λειτουργία και οι στόχοι SAP αποδίδονται ως εταιρική αναφορά. Η γραμμή SAP–παρακολούθηση αποτελεσμάτων δηλώνει ερευνητική συσχέτιση, όχι τεκμηριωμένη αιτιώδη επίδραση. Η υιοθέτηση ERP δεν τεκμηριώνει από μόνη της εταιρική χρήση μεγάλων γλωσσικών μοντέλων.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#276f5d"/></marker></defs>
