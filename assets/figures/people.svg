<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Άνθρωποι και μάθηση</title>
<desc id="figure-description">Πώς εξελίσσονται η εκπαίδευση και οι αποχωρήσεις, και τι χρειάζεται να διερευνήσει η διοίκηση; Ετήσια έκθεση 2025 · PDF σ. 114, 120–121 · έντυπες σ. 116, 122–123. Οι δείκτες και οι αναγνωρισμένοι κίνδυνοι αφορούν τον Όμιλο. Οι δύο δείκτες έχουν διαφορετικές μονάδες και κλίμακες. Ο δείκτης αποχωρήσεων χρησιμοποιεί ως παρονομαστή το προσωπικό στις 31/12. Οι διακεκομμένες συνδέσεις δηλώνουν θέματα που εξετάζουμε μαζί, χωρίς να αποδεικνύουν αιτιότητα.</desc>
